---
layout: default
---
<article class='article shell shell--narrow'>
  <a class='back-link' href='/news/'>← Alle Neuigkeiten</a>
  <header class='article__header'>
    <p class='eyebrow'>Neuigkeiten</p>
    <h1>{{ page.title }}</h1>
    <p class='article__meta'>
      <time datetime='{{ page.date | date_to_xmlschema }}'>{{ page.date | date: '%d.%m.%Y' }}</time>
    </p>
    {% if page.description %}<p class='lede'>{{ page.description }}</p>{% endif %}
  </header>
  <div class='prose'>
    {{ content }}
  </div>
</article>
