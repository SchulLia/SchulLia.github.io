<!doctype html>
<html lang='{{ site.lang }}'>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta id='theme-color' name='theme-color' content='#1c1c1c'>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('schullia-theme');
          const systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
          document.documentElement.dataset.theme = savedTheme || systemTheme;
        } catch (_error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name='description' content='{{ page.description | default: site.description | escape }}'>
    <link rel='canonical' href='{{ page.url | absolute_url }}'>
    <meta property='og:locale' content='de_DE'>
    {% if page.layout == 'post' %}
      <meta property='og:type' content='article'>
    {% else %}
      <meta property='og:type' content='website'>
    {% endif %}
    <meta property='og:title' content='{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}'>
    <meta property='og:description' content='{{ page.description | default: site.description | escape }}'>
    <meta property='og:url' content='{{ page.url | absolute_url }}'>
    <meta property='og:image' content='{{ site.url }}/assets/img/social-card.svg'>
    <link rel='icon' href='/assets/img/liascript-icon-mirrored.svg' type='image/svg+xml'>
    <link rel='alternate' type='application/atom+xml' title='SchulLia-Patchnotes' href='/feed.xml'>
    <link rel='stylesheet' href='/assets/css/main.css'>
    <link rel='stylesheet' href='/assets/css/liascript-theme.css?v={{ site.time | date: '%s' }}'>
    <script src='/assets/js/main.js' defer></script>
  </head>
  <body class='{{ page.body_class }}'>
    <a class='skip-link' href='#main-content'>Direkt zum Inhalt</a>
    {% include header.html %}
    <main id='main-content'>
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
