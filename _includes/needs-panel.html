<ul id='bedarfe' class='needs-list' aria-label='Bedarfe und Entwicklungsstand'>
  {% for need in needs %}
  {% assign need_stage = site.data.bedarfe.stages | where: 'id', need.stage | first %}
  <li class='need-card'>
    <span class='need-card__title'>{{ need.title }}</span>
    {% if need.status == 'erfuellt' %}
      <span
        class='need-card__symbol need-card__symbol--fulfilled'
        role='img'
        aria-label='Erf&uuml;llt'
        title='Erf&uuml;llt'
      >
        <span aria-hidden='true'>&#10003;</span>
      </span>
    {% else %}
      <span
        class='need-card__symbol'
        role='img'
        aria-label='Noch einzuordnen: {{ need_stage.label }}'
        title='Noch einzuordnen: {{ need_stage.label }}'
      >
        <img src='{{ need_stage.icon }}' alt='' width='44' height='44' aria-hidden='true' />
      </span>
    {% endif %}
  </li>
  {% endfor %}
</ul>
