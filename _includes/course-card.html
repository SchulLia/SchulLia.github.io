<a
  class='course-card course-card--{{ include.course.accent }}'
  href='{{ include.course.live_url }}'
  aria-label='{{ include.course.title }} direkt in LiaScript öffnen'
>
  <div class='course-card__top'>
    <span class='pill'>{{ include.course.type }}</span>
    <span class='course-card__source'>{{ include.course.source }}</span>
  </div>
  <h2>{{ include.course.title }}</h2>
  <p>{{ include.course.description }}</p>
  <span class='course-card__cta'>Kurs öffnen <span aria-hidden='true'>↗</span></span>
</a>
