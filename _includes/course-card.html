<article class='course-card course-card--{{ include.course.accent }}'>
  <div class='course-card__top'>
    <span class='pill'>{{ include.course.type }}</span>
    <span class='course-card__source'>{{ include.course.source }}</span>
  </div>
  <h2>{{ include.course.title }}</h2>
  <p>{{ include.course.description }}</p>
  <div class='course-card__actions'>
    {% if include.course.live_url %}
      <a class='button' href='{{ include.course.live_url }}'>Kurs öffnen <span aria-hidden='true'>↗</span></a>
    {% endif %}
    {% if include.course.editor_url %}
      <a class='text-link' href='{{ include.course.editor_url }}'>Im LiveEditor bearbeiten</a>
    {% endif %}
    <a class='text-link' href='{{ include.course.repo_url }}'>Auf GitHub ansehen</a>
  </div>
</article>
