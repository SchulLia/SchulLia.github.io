<header class="site-header">
  <div class="shell site-header__inner">
    <div class="site-header__brand-tools">
      <a class="brand" href="/" aria-label="SchulLia – Startseite">
        <img
          class="brand__logo"
          src="/pics/lrLia.png"
          width="32"
          height="32"
          alt=""
          aria-hidden="true"
        />
        <span>Schul<span>Lia</span></span>
      </a>
      <button
        class="theme-toggle"
        type="button"
        data-theme-toggle
        aria-label="Helles Design aktivieren"
        aria-pressed="true"
        title="Helles Design aktivieren"
      >
        <svg
          class="theme-toggle__icon theme-toggle__icon--moon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M20.2 15.3A8.6 8.6 0 0 1 8.7 3.8a8.7 8.7 0 1 0 11.5 11.5Z" />
        </svg>
        <svg
          class="theme-toggle__icon theme-toggle__icon--sun"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="12" cy="12" r="3.5" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </div>
    <button
      class="nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-navigation"
    >
      <span class="nav-toggle__label">Menü</span>
      <span class="nav-toggle__icon" aria-hidden="true"></span>
    </button>
    <nav id="site-navigation" class="site-nav" aria-label="Hauptnavigation">
      {% for item in site.data.navigation %} {% assign is_active = false %} {%
      if page.url == item.url %} {% assign is_active = true %} {% elsif
      item.url.size > 1 and page.url contains item.url %} {% assign is_active =
      true %} {% endif %}
      <a
        href="{{ item.url }}"
        {%
        if
        is_active
        %}
        aria-current="page"
        {%
        endif
        %}
        >{{ item.label }}</a
      >
      {% endfor %}
      <a
        class="button button--small"
        href="https://liascript.github.io/LiveEditor/"
        >LiveEditor öffnen</a
      >
    </nav>
  </div>
</header>
