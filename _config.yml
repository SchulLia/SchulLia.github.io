title: SchulLia
description: Interaktive Lernmaterialien mit LiaScript für Schule und Unterricht.
lang: de-DE
timezone: Europe/Berlin
url: https://schullia.github.io
baseurl: ""
repository: SchulLia/SchulLia.github.io
permalink: /news/:title/
markdown: kramdown
future: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
